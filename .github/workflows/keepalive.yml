# Keepalive — stops Render's free instance from spinning down (it sleeps after 15 idle minutes,
# and a wake costs the next user ~60s). GET / is unrouted (the app only serves POST /query), so
# every ping is a 404 that counts as traffic and never touches Bedrock — free to run.
#
# Note: GitHub fires schedules with up to a few minutes of delay; if cold starts reappear,
# tighten to */10. GitHub also disables schedules after 60 days without repo activity —
# re-enable under the Actions tab.
name: keepalive
on:
  schedule:
    - cron: "3,15,27,39,51 * * * *" # every 12min, offset off the congested :00-style slots (GitHub delays those)
  workflow_dispatch: # manual run, to test it
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      # --max-time 120 rides out a wake (~60s) if a ping ever lands after a sleep.
      - run: curl -sS -o /dev/null --max-time 120 -w "http=%{http_code} time=%{time_total}s\n" https://search-agent-ndgk.onrender.com/
