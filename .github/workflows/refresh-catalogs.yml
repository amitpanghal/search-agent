name: Refresh catalogs

# Rebuilds every sport's catalog from the live offering feed once a day, commits the
# result to main, and lets Render auto-deploy the new commit. No secrets: the build only
# hits the public Kambi feed and uses node + stdlib python3 (both preinstalled on the runner).
on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC daily. Change the hour for a different morning; GitHub may delay it a few min.
  workflow_dispatch: # lets you run it by hand from the Actions tab

permissions:
  contents: write # needed to push the refreshed catalog back to main

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run catalogs
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add catalogData
          git diff --cached --quiet && echo "no catalog changes" && exit 0
          git commit -m "chore(catalog): daily refresh"
          git push
