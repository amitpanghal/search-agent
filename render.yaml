# Render Blueprint — deploys the resolver as a free web service.
# Setup: push this repo to GitHub, then in Render pick "New > Blueprint" and point it here.
# Render will prompt for the Bedrock creds below (kept out of this file, so they're never committed).
services:
  - type: web
    name: search-agent
    runtime: node
    plan: free
    # Production-only install: runtime needs just the deps (tsx included). Skips playwright/
    # typescript devDeps — smaller build, and no Playwright browser download on deploy.
    buildCommand: npm install --omit=dev
    startCommand: npm start
    envVars:
      # Bedrock creds — enter these in the Render dashboard when prompted. Never commit them.
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        sync: false
      - key: BEDROCK_MODEL
        sync: false
